# XcodeGen 專案定義。在 Mac 上執行 `xcodegen generate` 產生 MapSpike.xcodeproj（不納入版本控制）。
name: MapSpike
options:
  bundleIdPrefix: mai.project.foodmap.spike
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 11.4.0
  GoogleMapsUtils:
    url: https://github.com/googlemaps/google-maps-ios-utils
    from: 7.1.2
targets:
  MapSpike:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Map Spike
        GMSApiKey: $(MAPS_API_KEY)
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      - package: GoogleMapsUtils
        product: GoogleMapsUtils
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mai.project.foodmap.spike.map
        SWIFT_VERSION: "5.0"
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
        ENABLE_USER_SCRIPT_SANDBOXING: NO
